<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的回忆 — 照片墙</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700&family=Caveat:wght@500;700&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream:   #F7F1E8;
      --cream2:  #FDF9F3;
      --beige:   #E8DED0;
      --brown:   #8B7355;
      --brown-d: #6B5B45;
      --brown-l: #B8A78E;
      --pink:    #E8C5C0;
      --pink-d:  #D4A5A0;
      --pink-l:  #F5E0DC;
      --blue:    #C5D5E0;
      --blue-l:  #E0EAF0;
      --green:   #C5D8C0;
      --yellow:  #F0E0C0;
      --white:   #FFFCF7;
      --shadow:  0 4px 20px rgba(139, 115, 85, 0.10);
      --shadow-h:0 8px 30px rgba(139, 115, 85, 0.18);
      --radius:  20px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--cream);
      color: var(--brown);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* ====== 动态背景 ====== */
    .bg-base {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(232, 197, 192, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 25%, rgba(197, 213, 224, 0.20) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 70%, rgba(240, 224, 192, 0.20) 0%, transparent 55%),
        linear-gradient(180deg, #FDF9F3 0%, #F7F1E8 40%, #F5EDE0 100%);
    }
    .bg-blob {
      position: fixed; border-radius: 50%; filter: blur(60px); z-index: 0; pointer-events: none;
    }
    .blob-1 { width: 350px; height: 350px; background: rgba(232, 197, 192, 0.35); top: -80px; left: -60px; animation: blobFloat1 20s ease-in-out infinite; }
    .blob-2 { width: 280px; height: 280px; background: rgba(197, 213, 224, 0.30); bottom: 10%; right: -60px; animation: blobFloat2 25s ease-in-out infinite; }
    .blob-3 { width: 220px; height: 220px; background: rgba(240, 224, 192, 0.35); top: 45%; left: 55%; animation: blobFloat1 30s ease-in-out infinite reverse; }
    @keyframes blobFloat1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, 30px) scale(1.05); } }
    @keyframes blobFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-40px, -20px) scale(0.95); } }

    #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    .content { position: relative; z-index: 2; }

    /* ====== 返回按钮 ====== */
    .back-bar {
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-btn {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: none;
      outline: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.2rem;
      background: var(--white);
      color: var(--brown-d);
      border: 2px solid var(--beige);
      border-radius: 30px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow);
    }
    .back-btn:hover {
      background: var(--pink-l);
      border-color: var(--pink);
      transform: translateX(-3px);
    }
    .back-btn svg { width: 16px; height: 16px; }

    /* ====== 标题区 ====== */
    .gallery-header {
      text-align: center;
      padding: 1rem 1.5rem 2rem;
    }
    .bear-img-gallery {
      width: clamp(90px, 14vw, 130px);
      height: auto;
      border-radius: 16px;
      margin: 0 auto 1rem;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(139, 115, 85, 0.12));
      animation: bearWobble 4s ease-in-out infinite;
    }
    @keyframes bearWobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-3deg); }
      75% { transform: rotate(3deg); }
    }
    .gallery-header h1 {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      color: var(--brown-d);
      margin-bottom: 0.3rem;
    }
    .gallery-header p {
      font-family: 'Caveat', cursive;
      font-size: 1.2rem;
      color: var(--pink-d);
    }
    .gallery-header .line {
      width: 50px; height: 3px; background: var(--pink); border-radius: 2px; margin: 0.8rem auto;
    }

    /* 照片统计 */
    .photo-stats {
      text-align: center;
      margin-bottom: 1.5rem;
      font-family: 'Caveat', cursive;
      font-size: 1rem;
      color: var(--brown-l);
    }
    .photo-stats span { color: var(--pink-d); font-weight: 700; }

    /* ====== 上传按钮 ====== */
    .upload-bar {
      text-align: center;
      margin-bottom: 2rem;
    }
    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.6rem;
      background: var(--white);
      color: var(--brown-d);
      border: 2px solid var(--pink);
      border-radius: 30px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 12px rgba(232, 197, 192, 0.3);
    }
    .upload-btn:hover { background: var(--pink-l); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232, 197, 192, 0.4); }
    .upload-btn:active { transform: translateY(0); }
    .upload-btn svg { width: 16px; height: 16px; }

    /* 管理按钮 */
    .manage-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.6rem;
      background: var(--brown-d);
      color: var(--white);
      border: none;
      border-radius: 30px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 3px 12px rgba(139, 115, 85, 0.25);
      margin-left: 0.6rem;
    }
    .manage-btn:hover { background: var(--brown); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 115, 85, 0.35); }
    .manage-btn:active { transform: translateY(0); }
    .manage-btn svg { width: 16px; height: 16px; }

    /* ====== 照片管理弹窗 ====== */
    .manage-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(139, 115, 85, 0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 1100; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.35s ease; padding: 1.5rem;
    }
    .manage-modal.active { opacity: 1; visibility: visible; }
    .manage-modal-content {
      background: var(--cream2); border: 2px solid var(--beige); border-radius: var(--radius);
      padding: 1.5rem; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto;
      transform: scale(0.92); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .manage-modal.active .manage-modal-content { transform: scale(1); }
    .manage-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 2px solid var(--beige);
    }
    .manage-header h3 {
      font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.3rem; color: var(--brown-d);
    }
    .manage-close {
      background: none; border: none; font-size: 1.6rem; color: var(--brown-l);
      cursor: pointer; transition: color 0.3s; line-height: 1;
    }
    .manage-close:hover { color: var(--pink-d); }

    /* 管理工具栏 */
    .manage-toolbar {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap;
    }
    .manage-count {
      font-size: 0.85rem; color: var(--brown-l);
    }
    .manage-count span { color: var(--pink-d); font-weight: 700; font-size: 1rem; }
    .manage-tab {
      padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.82rem; cursor: pointer;
      background: var(--white); color: var(--brown-l); border: 2px solid var(--beige);
      transition: all 0.3s ease;
    }
    .manage-tab:hover { border-color: var(--pink); color: var(--brown-d); }
    .manage-tab.active { background: var(--brown-d); color: var(--white); border-color: var(--brown-d); }
    .manage-tab span { font-weight: 700; margin-left: 0.2rem; }
    .manage-add-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.82rem; cursor: pointer;
      background: var(--pink); color: var(--brown-d); border: 2px solid var(--pink);
      transition: all 0.3s ease; margin-left: auto; font-family: 'Noto Sans SC', sans-serif; font-weight: 500;
    }
    .manage-add-btn:hover { background: var(--pink-d); border-color: var(--pink-d); color: var(--white); }
    .manage-add-btn svg { width: 14px; height: 14px; }

    /* 管理网格 */
    .manage-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.8rem;
    }
    .manage-card {
      background: var(--white); border: 2px solid var(--beige); border-radius: 14px;
      overflow: hidden; transition: all 0.3s ease; position: relative;
    }
    .manage-card:hover { border-color: var(--pink); box-shadow: var(--shadow-h); transform: translateY(-3px); }
    .manage-card-img {
      width: 100%; height: 130px; object-fit: cover; cursor: pointer; display: block;
    }
    .manage-card-info {
      padding: 0.5rem 0.6rem 0.3rem; font-size: 0.75rem;
    }
    .manage-card-title {
      color: var(--brown-d); font-weight: 500; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.15rem;
    }
    .manage-card-date {
      font-family: 'Caveat', cursive; color: var(--pink-d); font-size: 0.85rem;
    }
    .manage-card-actions {
      display: flex; gap: 0.25rem; padding: 0 0.5rem 0.5rem;
    }
    .manage-card-btn {
      flex: 1; padding: 0.3rem 0.15rem; border: none; border-radius: 8px;
      font-size: 0.68rem; cursor: pointer; transition: all 0.3s ease;
      font-family: 'Noto Sans SC', sans-serif; white-space: nowrap; text-align: center;
    }
    .manage-card-btn.preview { background: var(--blue-l); color: var(--brown-d); }
    .manage-card-btn.preview:hover { background: var(--blue); color: var(--white); }
    .manage-card-btn.edit { background: var(--pink-l); color: var(--brown-d); }
    .manage-card-btn.edit:hover { background: var(--pink); color: var(--white); }
    .manage-card-btn.delete { background: #F5DCDC; color: #C47878; }
    .manage-card-btn.delete:hover { background: #E8A0A0; color: var(--white); }

    .manage-empty {
      text-align: center; padding: 3rem 1rem; color: var(--brown-l);
    }
    .manage-empty p { font-size: 0.88rem; }

    /* ====== 编辑弹窗 ====== */
    .edit-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(139, 115, 85, 0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 1200; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.35s ease; padding: 1.5rem;
    }
    .edit-modal.active { opacity: 1; visibility: visible; }
    .edit-modal-content {
      background: var(--cream2); border: 2px solid var(--beige); border-radius: var(--radius);
      padding: 1.8rem; max-width: 400px; width: 100%;
      transform: scale(0.92); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .edit-modal.active .edit-modal-content { transform: scale(1); }
    .edit-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem;
    }
    .edit-header h3 {
      font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.2rem; color: var(--brown-d);
    }
    .edit-close {
      background: none; border: none; font-size: 1.6rem; color: var(--brown-l);
      cursor: pointer; transition: color 0.3s; line-height: 1;
    }
    .edit-close:hover { color: var(--pink-d); }
    .edit-preview {
      margin-bottom: 1.2rem; border-radius: 14px; overflow: hidden;
    }
    .edit-preview img {
      width: 100%; max-height: 200px; object-fit: cover; display: block;
    }

    /* ====== 照片墙 ====== */
    .gallery-section {
      padding: 0 1.5rem 5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .photo-wall { columns: 3; column-gap: 0.8rem; }
    .photo-item {
      break-inside: avoid; margin-bottom: 0.8rem; position: relative;
      border-radius: var(--radius); overflow: hidden; cursor: pointer;
      box-shadow: var(--shadow); border: 3px solid var(--white);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0; transform: translateY(25px);
    }
    .photo-item.visible { opacity: 1; transform: translateY(0); }
    .photo-item:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-h); border-color: var(--pink); }
    .photo-item img { width: 100%; display: block; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .photo-item:hover img { transform: scale(1.06); }
    .photo-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 1.5rem 1rem 0.6rem;
      background: linear-gradient(to top, rgba(247, 241, 232, 0.95), transparent);
      color: var(--brown-d); font-size: 0.85rem;
      opacity: 0; transform: translateY(8px); transition: all 0.4s ease;
    }
    .photo-item:hover .photo-overlay { opacity: 1; transform: translateY(0); }
    .photo-overlay .photo-date { font-family: 'Caveat', cursive; color: var(--pink-d); font-size: 0.95rem; }
    .photo-delete {
      position: absolute; top: 0.5rem; right: 0.5rem;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255, 252, 247, 0.85); color: var(--brown-d);
      border: none; cursor: pointer; font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: all 0.3s ease; z-index: 5;
    }
    .photo-item:hover .photo-delete { opacity: 1; }
    .photo-delete:hover { background: var(--pink-d); color: var(--white); }

    /* ====== 灯箱 ====== */
    .lightbox {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(139, 115, 85, 0.55);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 1000; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.4s ease; padding: 2rem;
    }
    .lightbox.active { opacity: 1; visibility: visible; }
    .lightbox img {
      max-width: 90%; max-height: 80vh; border-radius: var(--radius);
      border: 6px solid var(--white); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .lightbox.active img { transform: scale(1); }
    .lightbox-close {
      position: absolute; top: 1.5rem; right: 2rem; font-size: 2rem;
      color: var(--white); cursor: pointer; background: none; border: none; transition: color 0.3s;
    }
    .lightbox-close:hover { color: var(--pink); }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%); font-size: 2.5rem;
      color: rgba(255, 252, 247, 0.6); cursor: pointer; background: none; border: none;
      transition: color 0.3s; padding: 1rem;
    }
    .lightbox-nav:hover { color: var(--white); }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-caption {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: var(--white); font-family: 'Caveat', cursive; font-size: 1.3rem; text-align: center;
    }

    /* ====== 上传弹窗 ====== */
    .upload-modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(139, 115, 85, 0.4);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 1150; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.35s ease; padding: 1.5rem;
    }
    .upload-modal.active { opacity: 1; visibility: visible; }
    .upload-modal-content {
      background: var(--cream2); border: 2px solid var(--beige); border-radius: var(--radius);
      padding: 2rem; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto;
      transform: scale(0.92); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .upload-modal.active .upload-modal-content { transform: scale(1); }
    .upload-modal h3 {
      font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.3rem; color: var(--brown-d);
      text-align: center; margin-bottom: 1.5rem;
    }
    .drop-zone {
      border: 2px dashed var(--brown-l); border-radius: var(--radius);
      padding: 2rem 1rem; text-align: center; cursor: pointer;
      transition: all 0.3s ease; margin-bottom: 1.2rem; background: var(--white);
    }
    .drop-zone:hover { border-color: var(--pink-d); background: var(--pink-l); }
    .drop-zone.dragover { border-color: var(--pink-d); background: var(--pink-l); transform: scale(1.01); }
    .drop-zone .drop-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .drop-zone .drop-text { color: var(--brown-l); font-size: 0.9rem; }
    .drop-zone .drop-hint { color: var(--brown-l); font-size: 0.72rem; margin-top: 0.3rem; opacity: 0.7; }
    .upload-preview { display: none; margin-bottom: 1.2rem; border-radius: var(--radius); overflow: hidden; position: relative; }
    .upload-preview.show { display: block; }
    .upload-preview img { width: 100%; max-height: 240px; object-fit: cover; display: block; }
    .upload-preview .preview-remove {
      position: absolute; top: 0.5rem; right: 0.5rem; width: 28px; height: 28px;
      border-radius: 50%; background: rgba(255, 252, 247, 0.85); color: var(--brown-d);
      border: none; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: background 0.3s;
    }
    .upload-preview .preview-remove:hover { background: var(--pink-d); color: var(--white); }
    .upload-field { margin-bottom: 1rem; }
    .upload-field label { display: block; font-size: 0.8rem; color: var(--brown-l); margin-bottom: 0.4rem; }
    .upload-field input {
      width: 100%; padding: 0.6rem 0.9rem; background: var(--white);
      border: 2px solid var(--beige); border-radius: 12px; color: var(--brown-d);
      font-family: 'Noto Sans SC', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.3s;
    }
    .upload-field input:focus { border-color: var(--pink-d); }
    .upload-field input::placeholder { color: var(--brown-l); opacity: 0.5; }
    .upload-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
    .upload-actions button {
      flex: 1; padding: 0.65rem; border: none; border-radius: 12px;
      font-family: 'Noto Sans SC', sans-serif; font-size: 0.88rem; cursor: pointer; transition: all 0.3s ease;
    }
    .btn-save { background: var(--brown-d); color: var(--white); }
    .btn-save:hover { background: var(--brown); box-shadow: 0 4px 15px rgba(139, 115, 85, 0.3); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-cancel { background: var(--beige); color: var(--brown-d); }
    .btn-cancel:hover { background: var(--brown-l); color: var(--white); }

    /* Toast */
    .toast {
      position: fixed; top: 2rem; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: var(--white); color: var(--brown-d); padding: 0.7rem 1.5rem; border-radius: 30px;
      font-size: 0.88rem; z-index: 1200; box-shadow: var(--shadow-h); border: 2px solid var(--pink);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* 底部 */
    .footer { text-align: center; padding: 2rem; color: var(--brown-l); font-family: 'Caveat', cursive; font-size: 1rem; }
    .footer-bears { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .bear-img-footer { width: 80px; height: auto; border-radius: 12px; opacity: 0.9; }

    /* 响应式 */
    @media (max-width: 768px) { .photo-wall { columns: 2; } }
    @media (max-width: 480px) { .photo-wall { columns: 1; } }
  </style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <canvas id="particle-canvas"></canvas>

  <div class="content">
    <!-- 返回按钮 -->
    <div class="back-bar">
      <button class="back-btn" id="backHomeBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        回到首页
      </button>
    </div>

    <!-- 标题区 -->
    <div class="gallery-header">
      <img src="assets/bubu-dudu-2.png" alt="一二和布布" class="bear-img-gallery">

    <!-- 照片墙 -->
    <div class="gallery-section">

    <div class="footer">
      <div class="footer-bears">

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>

  <!-- 上传弹窗 -->
  <div class="upload-modal" id="uploadModal">
    <div class="upload-modal-content">
      <h3>添加我们的照片</h3>
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">&#128247;</div>
        <div class="drop-text">点击选择或拖拽照片到这里</div>

        <button class="btn-save" id="uploadSaveBtn" disabled>保存到照片墙</button>

  <!-- 照片管理弹窗 -->
  <div class="manage-modal" id="manageModal">
    <div class="manage-modal-content">
      <div class="manage-header">
        <h3>照片管理</h3>
        <button class="manage-close" id="manageCloseBtn">&times;</button>
      </div>
      <div class="manage-toolbar">
        <div class="manage-count">共 <span id="countAll">0</span> 张照片</div>
        <button class="manage-add-btn" id="openUploadBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          添加照片
        </button>
      </div>
      <div class="manage-grid" id="manageGrid"></div>
      <div class="manage-empty" id="manageEmpty" style="display:none;">
        <div style="font-size:2.5rem;margin-bottom:0.5rem;">&#128247;</div>
        <p>还没有照片，点击上方"添加照片"来记录你们的美好瞬间吧</p>
      </div>
    </div>
  </div>

  <!-- 照片管理 — 编辑弹窗 -->
  <div class="edit-modal" id="editModal">
    <div class="edit-modal-content">
      <div class="edit-header">
        <h3>编辑照片信息</h3>
        <button class="edit-close" id="editCloseBtn">&times;</button>
      </div>
      <div class="edit-preview">
        <img id="editPreviewImg" src="" alt="预览">
      </div>
      <div class="upload-field">
        <label>照片标题</label>
        <input type="text" id="editCaptionInput" placeholder="给这张照片起个名字..." maxlength="30">
      </div>
      <div class="upload-field">
        <label>拍摄日期</label>
        <input type="date" id="editDateInput">
      </div>
      <div class="upload-actions">
        <button class="btn-cancel" id="editCancelBtn">取消</button>
        <button class="btn-save" id="editSaveBtn">保存修改</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ============================================
    //  ★★★ 配置区 ★★★
    // ============================================
    const defaultPhotos = [
      { src: 'https://picsum.photos/seed/love1/600/800',  caption: '第一次牵手', date: '2023.09.15' },
      { src: 'https://picsum.photos/seed/love2/600/600',  caption: '秋日漫步',   date: '2023.10.03' },
      { src: 'https://picsum.photos/seed/love3/600/750',  caption: '海边日落',   date: '2023.11.12' },
      { src: 'https://picsum.photos/seed/love4/600/900',  caption: '冬日温暖',   date: '2023.12.20' },
      { src: 'https://picsum.photos/seed/love5/600/650',  caption: '新年烟花',   date: '2024.01.01' },
      { src: 'https://picsum.photos/seed/love6/600/800',  caption: '春暖花开',   date: '2024.03.15' },
      { src: 'https://picsum.photos/seed/love7/600/550',  caption: '一起做饭',   date: '2024.04.08' },
      { src: 'https://picsum.photos/seed/love8/600/700',  caption: '旅行记忆',   date: '2024.05.20' },
      { src: 'https://picsum.photos/seed/love9/600/850',  caption: '夏日海滩',   date: '2024.07.10' },
      { src: 'https://picsum.photos/seed/love10/600/600', caption: '星空之下',   date: '2024.08.01' },
      { src: 'https://picsum.photos/seed/love11/600/750', caption: '咖啡馆约会', date: '2024.09.05' },
      { src: 'https://picsum.photos/seed/love12/600/680', caption: '永远在一起', date: '2024.10.15' },
    ];

    const STORAGE_KEY = 'couple_website_photos';
    const INIT_KEY = 'couple_website_initialized';
    let photos = [];

    function loadPhotos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch (e) { return []; }
    }
    function savePhotos(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (e) { showToast('存储空间不足，请删除一些照片'); }
    }
    function refreshPhotos() {
      // 首次访问：用默认照片初始化
      if (!localStorage.getItem(INIT_KEY)) {
        savePhotos(defaultPhotos.map(p => ({ ...p })));
        localStorage.setItem(INIT_KEY, '1');
      }
      photos = loadPhotos();
    }
    refreshPhotos();

    // ============================================
    //  Toast
    // ============================================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    // ============================================
    //  照片墙渲染
    // ============================================
    const photoWall = document.getElementById('photoWall');
    const photoStatsEl = document.getElementById('photoStats');

    let scrollObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 80);
          scrollObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    function updateStats() {
      photoStatsEl.innerHTML = `共 <span>${photos.length}</span> 张美好回忆`;
    }

    function renderPhotoWall() {
      photoWall.innerHTML = '';
      photos.forEach((photo, index) => {
        const item = document.createElement('div');
        item.className = 'photo-item';
        item.dataset.index = index;
        item.innerHTML = `
          <button class="photo-delete" data-delete-index="${index}" title="删除">&times;</button>
          <img src="${photo.src}" alt="${photo.caption}" loading="lazy">
          <div class="photo-overlay">
            <div>${photo.caption}</div>
            <div class="photo-date">${photo.date}</div>
          </div>
        `;
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('photo-delete')) return;
          openLightbox(index);
        });
        photoWall.appendChild(item);
        scrollObserver.observe(item);
      });
      photoWall.querySelectorAll('.photo-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deletePhoto(parseInt(btn.dataset.deleteIndex));
        });
      });
      updateStats();
    }

    function deletePhoto(index) {
      if (index < 0 || index >= photos.length) return;
      photos.splice(index, 1);
      savePhotos(photos);
      renderPhotoWall();
      showToast('照片已删除');
    }

    renderPhotoWall();

    // ============================================
    //  灯箱
    // ============================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    let currentPhotoIndex = 0;

    function openLightbox(index) {
      currentPhotoIndex = index;
      showPhoto();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function showPhoto() {
      const photo = photos[currentPhotoIndex];
      lightboxImg.src = photo.src;
      lightboxCaption.textContent = `${photo.caption} · ${photo.date}`;
    }
    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
    function nextPhoto() {
      currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
      lightboxImg.style.opacity = '0';
      setTimeout(() => { showPhoto(); lightboxImg.style.opacity = '1'; }, 200);
    }
    function prevPhoto() {
      currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
      lightboxImg.style.opacity = '0';
      setTimeout(() => { showPhoto(); lightboxImg.style.opacity = '1'; }, 200);
    }

    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxNext').addEventListener('click', nextPhoto);
    document.getElementById('lightboxPrev').addEventListener('click', prevPhoto);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
    });
    lightboxImg.style.transition = 'opacity 0.3s ease';

    // ============================================
    //  照片上传
    // ============================================
    const uploadModal = document.getElementById('uploadModal');
    const openUploadBtn = document.getElementById('openUploadBtn');
    const uploadCancelBtn = document.getElementById('uploadCancelBtn');
    const uploadSaveBtn = document.getElementById('uploadSaveBtn');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadPreview = document.getElementById('uploadPreview');
    const previewImg = document.getElementById('previewImg');
    const previewRemove = document.getElementById('previewRemove');
    const captionInput = document.getElementById('captionInput');
    const dateInput = document.getElementById('dateInput');
    let currentImageData = null;

    function openUploadModal() {
      // 管理弹窗打开时不隐藏 body 滚动（由管理弹窗管理）
      uploadModal.classList.add('active');
      dateInput.value = new Date().toISOString().split('T')[0];
    }
    function closeUploadModal() {
      uploadModal.classList.remove('active');
      resetUploadForm();
    }
    function resetUploadForm() {
      currentImageData = null;
      fileInput.value = '';
      previewImg.src = '';
      uploadPreview.classList.remove('show');
      captionInput.value = '';
      dateInput.value = '';
      uploadSaveBtn.disabled = true;
      dropZone.style.display = 'block';
    }

    function compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleFile(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) { showToast('请选择图片文件'); return; }
      if (file.size > 10 * 1024 * 1024) { showToast('图片不能超过 10MB'); return; }
      try {
        const compressed = await compressImage(file, 1200, 0.8);
        currentImageData = compressed;
        previewImg.src = compressed;
        uploadPreview.classList.add('show');
        dropZone.style.display = 'none';
        uploadSaveBtn.disabled = false;
        if (!captionInput.value) captionInput.value = file.name.replace(/\.[^/.]+$/, '');
      } catch (err) { showToast('图片处理失败，请重试'); }
    }

    function saveUploadedPhoto() {
      if (!currentImageData) return;
      const caption = captionInput.value.trim() || '美好瞬间';
      const date = dateInput.value ? dateInput.value.replace(/-/g, '.') : new Date().toISOString().split('T')[0].replace(/-/g, '.');
      photos.unshift({ src: currentImageData, caption, date });
      savePhotos(photos);
      renderPhotoWall();
      renderManageGrid();
      closeUploadModal();
      showToast('照片添加成功！');
    }

    openUploadBtn.addEventListener('click', openUploadModal);
    uploadCancelBtn.addEventListener('click', closeUploadModal);
    uploadModal.addEventListener('click', (e) => { if (e.target === uploadModal) closeUploadModal(); });
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleFile(e.target.files[0]); });
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    previewRemove.addEventListener('click', (e) => { e.stopPropagation(); resetUploadForm(); });
    uploadSaveBtn.addEventListener('click', saveUploadedPhoto);
    captionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !uploadSaveBtn.disabled) saveUploadedPhoto();
    });

    // ============================================
    //  照片管理
    // ============================================
    const manageModal = document.getElementById('manageModal');
    const openManageBtn = document.getElementById('openManageBtn');
    const manageCloseBtn = document.getElementById('manageCloseBtn');
    const manageGrid = document.getElementById('manageGrid');
    const manageEmpty = document.getElementById('manageEmpty');
    let editingPhotoIndex = -1;

    // 编辑弹窗
    const editModal = document.getElementById('editModal');
    const editCloseBtn = document.getElementById('editCloseBtn');
    const editCancelBtn = document.getElementById('editCancelBtn');
    const editSaveBtn = document.getElementById('editSaveBtn');
    const editPreviewImg = document.getElementById('editPreviewImg');
    const editCaptionInput = document.getElementById('editCaptionInput');
    const editDateInput = document.getElementById('editDateInput');

    function openManageModal() {
      manageModal.classList.add('active');
      document.body.style.overflow = 'hidden';
      renderManageGrid();
    }
    function closeManageModal() {
      manageModal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function getFilteredPhotos() {
      return photos.map((p, i) => ({ ...p, _idx: i }));
    }

    function renderManageGrid() {
      document.getElementById('countAll').textContent = photos.length;

      const filtered = getFilteredPhotos();
      manageGrid.innerHTML = '';

      if (filtered.length === 0) {
        manageEmpty.style.display = 'block';
        manageGrid.style.display = 'none';
        return;
      }
      manageEmpty.style.display = 'none';
      manageGrid.style.display = 'grid';

      filtered.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'manage-card';
        card.innerHTML = `
          <img class="manage-card-img" src="${photo.src}" alt="${photo.caption}" data-action="preview" data-idx="${photo._idx}">
          <div class="manage-card-info">
            <div class="manage-card-title">${photo.caption}</div>
            <div class="manage-card-date">${photo.date}</div>
          </div>
          <div class="manage-card-actions">
            <button class="manage-card-btn preview" data-action="preview" data-idx="${photo._idx}">预览</button>
            <button class="manage-card-btn edit" data-action="edit" data-idx="${photo._idx}">编辑</button>
            <button class="manage-card-btn delete" data-action="delete" data-idx="${photo._idx}">删除</button>
          </div>
        `;
        manageGrid.appendChild(card);
      });

      // 绑定事件
      manageGrid.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = el.dataset.action;
          const idx = parseInt(el.dataset.idx);
          if (action === 'preview') {
            closeManageModal();
            setTimeout(() => openLightbox(idx), 200);
          } else if (action === 'edit') {
            openEditModal(idx);
          } else if (action === 'delete') {
            deletePhotoFromManage(idx);
          }
        });
      });
    }

    function deletePhotoFromManage(index) {
      if (index < 0 || index >= photos.length) return;
      photos.splice(index, 1);
      savePhotos(photos);
      renderPhotoWall();
      renderManageGrid();
      showToast('照片已删除');
    }

    function openEditModal(index) {
      if (index < 0 || index >= photos.length) return;
      editingPhotoIndex = index;
      const photo = photos[index];
      editPreviewImg.src = photo.src;
      editCaptionInput.value = photo.caption || '';
      editDateInput.value = (photo.date || '').replace(/\./g, '-');
      editModal.classList.add('active');
    }
    function closeEditModal() {
      editModal.classList.remove('active');
      editingPhotoIndex = -1;
    }
    function saveEdit() {
      if (editingPhotoIndex < 0 || editingPhotoIndex >= photos.length) return;
      photos[editingPhotoIndex].caption = editCaptionInput.value.trim() || '美好瞬间';
      photos[editingPhotoIndex].date = editDateInput.value
        ? editDateInput.value.replace(/-/g, '.')
        : new Date().toISOString().split('T')[0].replace(/-/g, '.');
      savePhotos(photos);
      renderPhotoWall();
      renderManageGrid();
      closeEditModal();
      showToast('修改已保存');
    }

    document.getElementById('backHomeBtn').addEventListener('click', () => {
      const url = new URL('index.html', window.location.href);
      window.location.assign(url.href);
    });
    openManageBtn.addEventListener('click', openManageModal);
    manageCloseBtn.addEventListener('click', closeManageModal);
    manageModal.addEventListener('click', (e) => { if (e.target === manageModal) closeManageModal(); });

    // 编辑弹窗事件
    editCloseBtn.addEventListener('click', closeEditModal);
    editCancelBtn.addEventListener('click', closeEditModal);
    editSaveBtn.addEventListener('click', saveEdit);
    editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });
    editCaptionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEdit(); });

    // ESC 关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (uploadModal.classList.contains('active')) closeUploadModal();
        else if (editModal.classList.contains('active')) closeEditModal();
        else if (manageModal.classList.contains('active')) closeManageModal();
      }
    });

    // ============================================
    //  柔和粒子系统
    // ============================================
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    const particleColors = [
      'rgba(232, 197, 192, 0.6)', 'rgba(197, 213, 224, 0.5)',
      'rgba(240, 224, 192, 0.5)', 'rgba(197, 216, 192, 0.45)',
      'rgba(212, 165, 160, 0.4)', 'rgba(184, 167, 142, 0.35)',
    ];

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * W;
        this.y = initial ? Math.random() * H : -20;
        this.size = Math.random() * 8 + 3;
        this.speedY = Math.random() * 0.8 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.angle = Math.random() * Math.PI * 2;
        this.angleSpeed = (Math.random() - 0.5) * 0.02;
        this.swing = Math.random() * 1.5 + 0.3;
        this.swingSpeed = Math.random() * 0.015 + 0.008;
        this.swingOffset = Math.random() * Math.PI * 2;
        this.color = particleColors[Math.floor(Math.random() * particleColors.length)];
        this.opacity = Math.random() * 0.4 + 0.3;
        this.isHeart = Math.random() < 0.3;
      }
      update(time) {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(time * this.swingSpeed + this.swingOffset) * this.swing * 0.2;
        this.angle += this.angleSpeed;
        if (this.y > H + 20) this.reset();
        if (this.x < -20) this.x = W + 20;
        if (this.x > W + 20) this.x = -20;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        if (this.isHeart) {
          const s = this.size * 0.5;
          ctx.beginPath();
          ctx.moveTo(0, s * 0.3);
          ctx.bezierCurveTo(0, 0, -s, 0, -s, s * 0.3);
          ctx.bezierCurveTo(-s, s * 0.6, 0, s * 0.8, 0, s);
          ctx.bezierCurveTo(0, s * 0.8, s, s * 0.6, s, s * 0.3);
          ctx.bezierCurveTo(s, 0, 0, 0, 0, s * 0.3);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    const particleCount = window.innerWidth < 768 ? 25 : 45;
    const particles = [];
    for (let i = 0; i < particleCount; i++) particles.push(new Particle());

    let mouseX = -1000, mouseY = -1000;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('mouseleave', () => { mouseX = -1000; mouseY = -1000; });

    let frameTime = 0;
    function animateParticles() {
      ctx.clearRect(0, 0, W, H);
      frameTime += 0.016;
      particles.forEach(p => {
        const dx = p.x - mouseX, dy = p.y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 100) {
          const force = (100 - dist) / 100;
          p.x += (dx / dist) * force * 2;
          p.y += (dy / dist) * force * 2;
        }
        p.update(frameTime);
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
